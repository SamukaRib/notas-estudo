<body>
    <main class="container">
        <h2>Login</h2>
        <form action="">
            <div class="input-field">
                <input type="text" name="email" class="input" id="email" required placeholder="Digite seu email">
                <div class="underline"></div>
            </div>
            <div class="input-field">
                 <input type="senha" name="senha" class="input" id="senha" required
                 placeholder="Digite sua senha">

                 </div>
                 <input type="submit" value="Login">
                 </form>
                
                 <p> Forgot Password?</p>
                <p>Don't have an account? Sign up</p>


    </main>
